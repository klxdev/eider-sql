[package]
name = "sql"
version = "0.7.1"
eider = "0.7"
main = "bin/main.ei"
description = "Checked SQL for Eider: a migration runner, a DDL and query checker with no database, a generator of typed query modules (eider-sql gen), a batch loader and a typed builder for dynamic SQL, on eider-postgres (docs/design.md)"

# The PostgreSQL client. A path dependency until eider-postgres (itself on path dependencies for eider-tls
# and crypto) is consumable through its repository: scripts/env.sh links ../eider-postgres (or
# $EIDER_POSTGRES) at target/deps/postgres.
[deps.postgres]
path = "target/deps/postgres"
uses = ["net", "io", "clock", "fs"]

# The command line of the eider-sql program (main.ei).
[deps.command]
git = "https://github.com/klxdev/eider-command.git"
version = "0.7.0"
uses = ["io"]
